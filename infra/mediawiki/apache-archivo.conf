ServerTokens Prod
ServerSignature Off
Alias /wiki /var/www/html
<Directory /var/www/html>
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
<DirectoryMatch "/(maintenance|cache|tests|vendor|sql|includes)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^LocalSettings\.php$|^composer\.|^\.env$|\.sql$|\.sqlite$|\.sqlite-journal$)">
    Require all denied
</FilesMatch>
<Location /wiki/mw-config>
    Require all denied
</Location>
